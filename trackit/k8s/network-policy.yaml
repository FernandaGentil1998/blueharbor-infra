apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trackit-network-policy
  namespace: trackit
spec:
  podSelector:
    matchLabels:
      app: trackit
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: trackit
      ports:
        - protocol: TCP
          port: 5000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-network-policy
  namespace: trackit
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: trackit
      ports:
        - protocol: TCP
          port: 6379