apiVersion: apps/v1
kind: Deployment
metadata:
  name: trackit
  namespace: trackit
spec:
  replicas: 2
  selector:
    matchLabels:
      app: trackit
  template:
    metadata:
      labels:
        app: trackit
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: trackit
          image: trackit@sha256:8945c9000ef5ce7b7de367b274d94b56a56c47439fe021f600775bfa68b8b5b7
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: APP_VERSION
              value: "1.1.0"
            - name: REDIS_HOST
              value: cache
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: trackit
  namespace: trackit
spec:
  type: ClusterIP
  selector:
    app: trackit
  ports:
    - port: 5000
      targetPort: 5000